  X.save();X.globalCompositeOperation='lighter';X.strokeStyle=hexA(c,.16*k);X.lineWidth=DPR*(5+6*pop);X.stroke(p);X.restore();

const DUST=[...Array(70)].map((_,i)=>{let s=i*9301+49297;const r=()=>((s=(s*233280+1)%2147483647)/2147483647);return{a:r()*6.283,v:5+r()*12,s:.4+r()*.9};});
function paint(L,e,R0){

    if(yieldNow==null){const bi=BANDS.indexOf(band(m.rate)),k=clamp(REVEAL-bi,0,1);if(k<=0){X.strokeStyle=L?'rgba(0,0,0,.14)':'rgba(150,160,180,.12)';X.lineWidth=DPR*.7;X.stroke(p);continue;}glowCity(L,m,p,k,clamp(1-(REVEAL-bi)/1.2,0,1)*(REVEAL<4?1:0));}

  // 街の中心の点
  for(const m of MAP){if(!m.rate)continue;const q=pj(m.c[0],m.c[1]);if(!q)continue;if(yieldNow==null&&BANDS.indexOf(band(m.rate))>=REVEAL)continue;const dim=yieldNow!=null&&m.rate>yieldNow+1e-9;const r=clamp(FL*.5/q[2],1,6)*(DPR>1?1:1);
    X.beginPath();X.arc(q[0],q[1],r,0,7);X.fillStyle=L?(dim?'rgba(0,0,0,.12)':'rgba(25,32,48,.8)'):(dim?'rgba(200,205,215,.25)':'rgba(255,255,255,.92)');X.fill();}
  // 選んだ街

  // 衝撃の輪

    X.strokeStyle=`rgba(255,240,210,${.9*a})`;X.lineWidth=3*DPR;X.shadowColor='#E7B065';X.shadowBlur=24*DPR;X.stroke();X.restore();}

    X.strokeStyle=L?'rgba(20,28,45,.75)':'rgba(255,255,255,.75)';X.lineWidth=2.4*DPR;X.stroke();}}

    X.font=`800 ${12.5*DPR}px "Noto Sans JP",sans-serif`;const w=X.measureText(lab).width+14*DPR,h=20*DPR,y=q[1]-16*DPR;

    X.strokeStyle=L?'rgba(0,0,0,.25)':'rgba(255,255,255,.35)';X.lineWidth=1*DPR;X.stroke();
    X.fillStyle=L?'#1b2333':'#fff';X.fillText(lab,q[0],y+0.5*DPR);

  // 都県名（大きく・いつも出す）
  for(const pf of PREFS){const c=PREF_POS[pf],q=pj(c[0],c[1]);if(!q)continue;const sz=clamp(FL*9/q[2],14,22)*DPR/(DPR>1?1.15:1);
    X.font=`900 ${sz}px "Noto Sans JP",sans-serif`;X.lineWidth=sz*.28;X.lineJoin='round';X.strokeStyle=L?'rgba(255,255,255,.95)':'rgba(6,11,22,.9)';X.strokeText(pf,q[0],q[1]);X.fillStyle=L?'#1b2333':'#ffffff';X.fillText(pf,q[0],q[1]);}
  // 実例のピン
  for(const p of PROPS){if(p===sel)continue;const q=pj(p.gx,p.gy);if(!q)continue;const ok=p.y>=p.line;p._s=q;
    const s=clamp(FL*1.2/q[2],7,16)*DPR/ (DPR>1?1.4:1);
    X.save();X.translate(q[0],q[1]);X.fillStyle=ok?'#E7B065':'#ff8a8a';X.strokeStyle=L?'#fff':'#0a1120';X.lineWidth=2*DPR;
    X.beginPath();X.moveTo(0,0);X.lineTo(-s*.9,-s*1.3);X.lineTo(-s*.9,-s*2.4);X.lineTo(0,-s*3.2);X.lineTo(s*.9,-s*2.4);X.lineTo(s*.9,-s*1.3);X.closePath();X.fill();X.stroke();
    X.fillStyle='#0a1120';X.fillRect(-s*.28,-s*2.05,s*.56,s*.62);X.restore();
    if(cam.dist<230){X.font=`700 ${11*DPR}px "Noto Sans JP",sans-serif`;X.lineWidth=3*DPR;X.strokeStyle='rgba(6,11,22,.9)';X.strokeText(p.y+'%',q[0],q[1]-s*3.9);X.fillStyle='#fff';X.fillText(p.y+'%',q[0],q[1]-s*3.9);}}
}
function ringR(t){return 230*eo((t-0.62)/2.4);}
function draw(){
  const t=now(),dt=Math.min(0.25,t-(draw.last||t));draw.last=t;const kk=1-Math.exp(-dt*7);   // 画面の速さに関係なく同じ速さで寄る
  for(const k in cam)cam[k]+=(goal[k]-cam[k])*kk;
  if(spin)goal.yaw+=15*dt;
  setCam(cam);
  const e=t-tSel;let shake=0;if(sel&&e>0.55&&e<1.0)shake=(1-(e-0.55)/0.45)**2*6*DPR;
  X.setTransform(1,0,0,1,shake?(Math.random()-.5)*shake:0,shake?(Math.random()-.5)*shake:0);
  const R0=origin&&yieldNow!=null?ringR(e):Infinity;
  // 昼（明るい）と夜（暗い）。切り替え中はタップした所から夜が円で広がる
  const nr=nightR(t);
  if(nr==null)paint(!dark,e,R0);
  else{paint(NT.to,e,R0);X.save();X.beginPath();X.arc(NT.ox,NT.oy,nr,0,7);X.clip();paint(!NT.to,e,R0);X.restore();
    X.save();X.beginPath();X.arc(NT.ox,NT.oy,nr,0,7);X.strokeStyle='rgba(255,226,170,.85)';X.lineWidth=3*DPR;X.shadowColor='#E7B065';X.shadowBlur=30*DPR;X.stroke();X.restore();}
  // 選んだ家：落下と着地
  if(house){const fz=e<0.55?60*(1-(e/0.55)**2):0;const k=e>0.55&&e<1.1?Math.exp(-(e-.55)*9)*Math.cos((e-.55)*28):0;house.position.z=Math.max(0,fz);house.scale.set(1+.1*k,1+.1*k,1-.2*k);const bb=house.getObjectByName('bb');if(bb)bb.rotation.z=Math.atan2(P[0]-house.position.x,-(P[1]-house.position.y));house.rotation.z=0;
    if(e>0.55&&e<1.8){const q=pj(sel.gx,sel.gy),k2=eo((e-.55)/1.25);for(const d of DUST){const r=pj(sel.gx+Math.cos(d.a)*(8+d.v*k2),sel.gy+Math.sin(d.a)*(7+d.v*k2),k2*4*d.s);if(!r)continue;X.beginPath();X.arc(r[0],r[1],FL*.45*d.s/r[2]*(1+k2),0,7);X.fillStyle=`rgba(210,196,170,${.5*(1-k2)})`;X.fill();}}}
  X.setTransform(1,0,0,1,0,0);
  {const pl=$('#place');if(sel&&e>0.5){const q0=pj(sel.gx,sel.gy,0),qt=pj(sel.gx,sel.gy,sel.cut?22:14);const q=q0&&qt?[q0[0],qt[1]-10*DPR]:null;if(q){pl.style.display='block';pl.style.left=(q[0]/DPR)+'px';pl.style.top=(q[1]/DPR)+'px';pl.style.opacity=String(clamp((e-0.5)/0.25,0,1));pl.innerHTML=`<small>${sel.pref}</small>${sel.city}`;}else pl.style.display='none';}else pl.style.display='none';}

}
function loop(){draw();requestAnimationFrame(loop);}

// ── 操作 ─────────────────────────────
const pts=new Map();let down=null,moved=0,pinch0=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);down=[e.clientX,e.clientY,e.button,e.shiftKey];moved=0;spin=false;if(pts.size===2){const[a,b]=[...pts.values()];pinch0=[Math.hypot(a[0]-b[0],a[1]-b[1]),goal.dist,Math.atan2(b[1]-a[1],b[0]-a[0]),goal.yaw];}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);const dx=e.clientX-o[0],dy=e.clientY-o[1];pts.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
  if(pts.size===2&&pinch0){const[a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);goal.dist=clamp(pinch0[1]*pinch0[0]/d,40,600);goal.yaw=pinch0[3]-(Math.atan2(b[1]-a[1],b[0]-a[0])-pinch0[2])*57.3;return;}
  if(down&&(down[2]===2||down[3])){goal.yaw-=dx*.3;goal.pit=clamp(goal.pit+dy*.25,20,89);return;}
  const k=goal.dist/FL*DPR*1.2,y=goal.yaw*Math.PI/180;const ex=[Math.cos(y),Math.sin(y)],ny=[-Math.sin(y),Math.cos(y)];goal.tx-=(dx*ex[0]-dy*ny[0])*k;goal.ty-=(dx*ex[1]-dy*ny[1])*k;});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=null;if(down&&moved<8&&pts.size===0)pick(e.clientX,e.clientY);if(pts.size===0)down=null;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);down=null;});cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();goal.dist=clamp(goal.dist*Math.exp(e.deltaY*0.0015),40,600);},{passive:false});
function pick(cx,cy){const r=cv.getBoundingClientRect(),sx=(cx-r.left)*DPR,sy=(cy-r.top)*DPR;
  let best=null,bd=26*DPR;for(const p of PROPS){if(!p._s)continue;const d=Math.hypot(p._s[0]-sx,p._s[1]-(sy+12*DPR));if(d<bd){bd=d;best=p;}}
  if(best){openTab('props');selectProp(best);scrollToSel();return;}
  const g=unpj(sx,sy);if(!g)return;for(const m of MAP){if(!m.rate)continue;for(const ring of m.rings)if(inPoly(g[0],g[1],ring)){openTab('area');selectCity(m);return;}}}
function inPoly(x,y,r){let c=false;for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){const xi=r[i],yi=r[i+1],xj=r[j],yj=r[j+1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
$('#zin').onclick=()=>goal.dist=clamp(goal.dist*.7,40,600);$('#zout').onclick=()=>goal.dist=clamp(goal.dist/.7,40,600);

let tab='props',prefF='すべて',kindF='すべて',q='';
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));
function openTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();}
const yen=v=>v>=1000?(v/10000).toFixed(0)+'億':(Math.round(v*10)/10)+'万円';

    <label class="f">STEP4 物件のある市区町村（任意）</label><input class="search" id="dc" list="cities" placeholder="例 牛久市"><datalist id="cities">${MAP.filter(m=>m.rate).map(m=>`<option value="${m.name}">${m.pref}</option>`).join('')}</datalist>
    <button class="go" id="dgo">診断する</button><div id="dres"></div>
    <div class="note">表面利回り＝年間家賃÷（物件価格＋リフォーム費）。円で入れても自動で万円に直します。登記費用や税金を入れるともう少し下がります。</div></div>`;}
  B.innerHTML=h;
  B.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{selectProp(PROPS.find(p=>p.id===el.dataset.id));B.scrollTop=0;});
  B.querySelectorAll('[data-set]').forEach(el=>el.onclick=()=>{$('#'+el.dataset.set).value=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));});
  B.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{kindF=el.dataset.k;render();});
  B.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>{prefF=el.dataset.p;render();});
  B.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{const[pf,n]=el.dataset.c.split('|');selectCity(byCity(pf,n));B.scrollTop=0;});
  const qi=$('#q');if(qi){qi.oninput=()=>{q=qi.value.trim();const pos=qi.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);};}
  const go=$('#dgo');if(go)go.onclick=()=>{const man=v=>{v=parseFloat(String(v).replace(/[^0-9.]/g,''));if(!isFinite(v))return NaN;return v>=10000?v/10000:v;};
    const pr=man($('#dp').value),rf=man($('#dr').value)||0,rent=man($('#dy').value);const out=$('#dres');
    if(!(pr>0)||!(rent>0)){out.innerHTML='<div class="verdict v-ng">物件価格と家賃を入れてください</div>';return;}
    const y=Math.round(rent*12/(pr+rf)*1000)/10,cn=$('#dc').value.trim(),m=MAP.find(x=>x.rate&&x.name===cn);
    out.innerHTML=`<div class="verdict ${!m||y>=m.rate?'v-ok':'v-ng'}">表面利回り <b style="font-size:20px">${y}%</b><br>${m?`${m.name}の合格ラインは ${m.rate}% → <b>${y>=m.rate?'合格':'あと'+(m.rate-y).toFixed(1)+'%'}</b><br>`:''}関東の <b>${passPct(y)}%</b> のエリアで合格ライン以上</div>`;
    diagnose(y,m);};
}
